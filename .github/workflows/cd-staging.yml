# OpsCore v2.0 - CD Staging Pipeline
#
# Runs on: push to main
# Deploys to: staging Azure Functions
#
# Steps:
#   - Validate Bicep template
#   - Build Go application
#   - Deploy infrastructure (staging)
#   - Deploy Functions code
#   - Run smoke tests

name: CD Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deployment (for testing CI)'
        required: false
        type: boolean

env:
  GO_VERSION: '1.25'
  AZURE_VERSION: '3.383.0'
  ENVIRONMENT: 'staging'
  RESOURCE_GROUP: 'opscore-staging-rg'

jobs:
  # =======================================================================
  # Validate Infrastructure
  # =======================================================================
  validate-infra:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
          enable-AzPSSession: true

      - name: Set up Bicep
        uses: azure/bicep-deploy@v1
        with:
          bicepVersion: 'v0.31.0'

      - name: Validate Bicep template
        run: |
          az deployment group validate \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters environment=staging \
            --location eastus

      - name: Check existing deployments
        run: |
          echo "Checking existing resources..."
          az group show --name ${{ env.RESOURCE_GROUP }} || echo "Resource group does not exist"

  # =======================================================================
  # Build Application
  # =======================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [validate-infra]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./internal/domain/... -v -race

      - name: Build application
        run: |
          mkdir -p publish
          go build -o publish/function-app ./cmd function

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: publish/
          retention-days: 7

  # =======================================================================
  # Deploy Infrastructure
  # =======================================================================
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      !github.event.inputs.skip_deploy
    permissions:
      id-token: write
      contents: read
    
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
          enable-AzPSSession: true

      - name: Set up Bicep
        uses: azure/bicep-deploy@v1
        with:
          bicepVersion: 'v0.31.0'

      - name: Deploy or update Bicep template
        run: |
          # Check if resource group exists
          RG_EXISTS=$(az group exists --name ${{ env.RESOURCE_GROUP }} 2>/dev/null || echo "false")
          
          if [ "$RG_EXISTS" = "false" ]; then
            echo "Creating resource group..."
            az group create \
              --name ${{ env.RESOURCE_GROUP }} \
              --location eastus
          fi
          
          # Deploy template
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters environment=staging \
            --location eastus \
            --mode Incremental

      - name: Get deployment outputs
        run: |
          echo "storageConnectionString=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.storageConnectionString.value \
            -o tsv)" >> $GITHUB_OUTPUT
          
          echo "cosmosDbEndpoint=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.cosmosDbEndpoint.value \
            -o tsv)" >> $GITHUB_OUTPUT
          
          echo "functionAppName=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name main \
            --query properties.outputs.functionAppName.value \
            -o tsv)" >> $GITHUB_OUTPUT
        id: outputs

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: ${{ github.outputs_file }}
          retention-days: 7

  # =======================================================================
  # Deploy Azure Functions
  # =======================================================================
  deploy-functions:
    name: Deploy Functions
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    if: |
      !github.event.inputs.skip_deploy
    permissions:
      id-token: write
      contents: read
    
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: publish/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
          enable-AzPSSession: true

      - name: Download Azure Functions Core Tools
        run: |
          wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install azure-functions-core-tools-4
          rm packages-microsoft-prod.deb

      - name: Deploy to Azure Functions
        run: |
          FUNC_NAME="${{ needs.deploy-infra.outputs.functionAppName }}"
          az functionapp deployment source config-zip \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name "$FUNC_NAME" \
            --src publish/function-app.zip || \
          func azure functionapp deployment "$FUNC_NAME" --publish-path publish/
        shell: bash

      - name: Verify deployment
        run: |
          FUNC_NAME="${{ needs.deploy-infra.outputs.functionAppName }}"
          az functionapp show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name "$FUNC_NAME" \
            --query state

      - name: Restart Functions
        run: |
          FUNC_NAME="${{ needs.deploy-infra.outputs.functionAppName }}"
          az functionapp restart \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name "$FUNC_NAME }}"

  # =======================================================================
  # Smoke Tests
  # =======================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-functions]
    if: |
      !github.event.inputs.skip_deploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment outputs
        uses: actions/download-artifact@v4
        with:
          name: deployment-outputs

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}
          enable-AzPSSession: true

      - name: Get Function App URL
        run: |
          FUNC_URL="https://$(az functionapp show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name opscore-staging-func \
            --query defaultHostName \
            -o tsv)/api/"
          echo "FUNC_URL=$FUNC_URL"

      - name: Test health endpoint
        run: |
          curl -f "${FUNC_URL}health" || echo "Health check failed"
        shell: bash

      - name: Test API ready
        run: |
          # Test that Functions are responding
          ENDPOINTS=(
            "health"
          )
          
          for endpoint in "${ENDPOINTS[@]}"; do
            status=$(curl -sf -o /dev/null -w "%{http_code}" \
              "${FUNC_URL}${endpoint}" || echo "000")
            echo "Endpoint ${endpoint}: $status"
          done

      - name: Run Go tests
        run: |
          go test ./internal/... -v -short

  # =======================================================================
  # Notify Ready for Review
  # =======================================================================
  notify:
    name: Notify Ready
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          echo "## Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: staging" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Resources: Azure Functions, Cosmos DB, Storage, App Insights" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for production deployment with tag v*." >> $GITHUB_STEP_SUMMARY