# OpsCore v3.0 - CD Staging Pipeline
#
# Runs on: push to main
# Builds and pushes a Docker image to GitHub Container Registry
#
# Steps:
#   - Run unit tests
#   - Build Go binary
#   - Build and push Docker image
#   - Run smoke test against built container

name: CD Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deployment (for testing CI)'
        required: false
        type: boolean

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ENVIRONMENT: staging

jobs:
  # =======================================================================
  # Unit Tests
  # =======================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./internal/domain/... -v -race

      - name: Build check
        run: go build ./...

      - name: Python syntax check
        run: |
          python3 -m py_compile ops-ui/app.py
          python3 -m py_compile ops-ui/config.py

  # =======================================================================
  # Build and Push Docker Image
  # =======================================================================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: |
      !github.event.inputs.skip_deploy
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Go binary
        run: |
          mkdir -p publish
          go build -o publish/opscore-server ./cmd/functions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging-latest
            type=sha,prefix=staging-
            type=raw,value=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =======================================================================
  # Smoke Test
  # =======================================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: |
      !github.event.inputs.skip_deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull and run built image
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image_tag }}"
          # Extract first tag from comma-separated list
          FIRST_TAG=$(echo "$IMAGE" | cut -d',' -f1)
          
          docker run -d \
            --name opscore-staging \
            -p 8080:8080 \
            -e APP_ENV=staging \
            -e PORT=8080 \
            "$FIRST_TAG"
          
          # Wait for container to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 2
          done

      - name: Test health endpoint
        run: |
          curl -sf http://localhost:8080/health || echo "Health check failed"
          curl -sf http://localhost:8080/api/health || echo "API health check failed"

      - name: Stop container
        if: always()
        run: docker stop opscore-staging && docker rm opscore-staging

  # =======================================================================
  # Notify Ready for Review
  # =======================================================================
  notify:
    name: Notify Ready
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          echo "## Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: staging" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ needs.smoke-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ghcr.io/${{ github.repository }}:staging-latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for production deployment with tag v*." >> $GITHUB_STEP_SUMMARY
