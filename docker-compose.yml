# OpsCore v3.0 - Production-Like Local Development
# Full stack: PostgreSQL, MinIO (S3), Redis, and the app server
#
# Usage:
#   docker compose up -d                        # Start everything
#   docker compose logs -f                      # Follow logs
#   docker compose down                          # Stop and remove
#   docker compose down -v                       # Stop and wipe volumes (data loss)

services:
  postgres:
    image: postgres:16-alpine
    container_name: opscore-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: opscore
      POSTGRES_USER: opscore
      POSTGRES_PASSWORD: opscore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opscore -d opscore"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - opscore-dev

  minio:
    image: minio/minio:latest
    container_name: opscore-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - opscore-dev

  redis:
    image: redis:7-alpine
    container_name: opscore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opscore-dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opscore-app
    ports:
      - "8080:8080"
    environment:
      # Database (PostgreSQL) — use Docker service name as host
      DATABASE_URL: postgres://opscore:opscore@postgres:5432/opscore?sslmode=disable
      # S3-compatible Storage (MinIO) — use Docker service name as host
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      # Queue (Redis) — use Docker service name as host
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      # Server
      PORT: "8080"
      APP_ENV: development
      # AI Provider (set locally if needed)
      SARVAM_API_KEY: ""
      # Slack HITL (set locally if needed)
      SLACK_BOT_TOKEN: ""
      SLACK_SIGNING_SECRET: ""
      SLACK_HITL_CHANNEL: ""
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opscore-dev

networks:
  opscore-dev:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
