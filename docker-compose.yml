version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opscore-postgres
    environment:
      POSTGRES_DB: opscore
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d opscore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opscore-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  neo4j:
    image: neo4j:5.20-community
    container_name: opscore-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 128m
      NEO4J_dbms_memory_heap_max__size: 256m
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  redisdata:
  neo4jdata: