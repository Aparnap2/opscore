version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      temporal:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./apps/api:/app/apps/api
      - ./libs:/app/libs
    networks:
      - opscore-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: opscore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opscore}
      POSTGRES_USER: ${POSTGRES_USER:-opscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opscore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opscore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opscore-network

  redis:
    image: redis:7-alpine
    container_name: opscore-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - opscore-network

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: opscore-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - opscore-network

  neo4j:
    image: neo4j:5.20-community
    container_name: opscore-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    networks:
      - opscore-network

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: opscore-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opscore}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-opscore}
      POSTGRES_SEEDS: postgres
      TEMPORAL_SCHEMA_FILE: postgresql
    ports:
      - "7233:7233"
    networks:
      - opscore-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: opscore-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "*"
    ports:
      - "8233:8233"
    depends_on:
      - temporal
    networks:
      - opscore-network

  minio:
    image: minio/minio:latest
    container_name: opscore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - opscore-network

  langfuse:
    image: langfuse/langfuse:v2.21.0
    container_name: opscore-langfuse
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opscore}:${POSTGRES_PASSWORD:-opscore}@postgres:5432/${POSTGRES_DB:-opscore}
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-change-this-in-production}
      LANGFUSE_ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      SALT_KEY: ${LANGFUSE_SALT:-change-this-in-production}
      LANGFUSE_S3_ENABLED: "false"
    ports:
      - "3000:3000"
    networks:
      - opscore-network

  grafana:
    image: grafana/grafana:latest
    container_name: opscore-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning
    networks:
      - opscore-network

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: opscore-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - prometheusdata:/prometheus
      - ./config/prometheus:/etc/prometheus
    networks:
      - opscore-network

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  neo4jdata:
  miniodata:
  grafanadata:
  prometheusdata:

networks:
  opscore-network:
    driver: bridge