# OpsCore v2.0 - Test Infrastructure
# Cosmos DB emulator, Azurite, and Mockoon for local integration testing
#
# Usage:
#   docker-compose -f docker-compose.test.yml up -d
#   docker-compose -f docker-compose.test.yml ps
#   docker-compose -f docker-compose.test.yml down
#
# Note:
#   - Cosmos emulator requires >=4GB RAM
#   - Azurite uses default storage account (devstoreaccount1)
#   - Mockoon loads slack_mock.json for Slack API mocking

services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: opscore-cosmos
    ports:
      - "8081:8081"
      - "1234:1234"
      - "8913:8913"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_DIRECT_MODE=true
    mem_reservation: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/_explorer/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - opscore-test

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: opscore-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXg==
      - AZURITE_HOST=0.0.0.0
      - AZURITE_BLOB_PROXY_HOST=0.0.0.0
      - AZURITE_TABLE_PROXY_HOST=0.0.0.0
      - AZURITE_QUEUE_PROXY_HOST=0.0.0.0
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - opscore-test

  mockoon:
    image: mockoon/cli:latest
    container_name: opscore-mockoon
    ports:
      - "3100:3100"
    volumes:
      - ./tests/mockoon:/data
    command: ["--port", "3100", "--data", "/data/slack_mock.json"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - opscore-test

networks:
  opscore-test:
    driver: bridge

volumes:
  azurite-data: