[project]
name = "opscore"
version = "0.1.0"
description = "Agentic Internal Operations Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "passlib[bcrypt]>=1.7.4",

    "redis>=5.2.0",
    "arq>=0.26.0",

    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=0.4.0",

    "docling>=2.0.0",
    "rapidocr-onnxruntime>=1.3.0",

    "crawl4ai>=0.4.0",

    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langfuse>=2.0.0",

    "graphiti-core>=0.28.2",
    "neo4j>=5.25.0",

    "slack-sdk>=4.0.0",
    "slack-bolt>=1.21.0",

    "ragas>=0.2.0",

    "httpx>=0.28.0",
    "sse-starlette>=2.2.0",

    "prometheus-client>=0.21.0",

    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",

    "aiofiles>=24.1.0",

    "pypdf>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.1.0",
    "black>=24.10.0",
    "isort>=5.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
